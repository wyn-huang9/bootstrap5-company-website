<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>无标题文档</title>
	<style>
		body{
			height: 100vh;
			background-image: linear-gradient(100deg,#D6F5FF 0%,#FFFCE9 100%);
			display: flex;
			justify-content: center;
			align-items: center;
			margin:0;
			line-height: 25px;
			
		}
		.box{
			background-color: #FFFEC5;
			border-radius: 10px;
		    height: 200px;
			width: 300px; 
			
			box-shadow: 0 5px 15px rgba(0,0,0,0.1);
			padding: 20px;
		}
		.box1{
			text-align: center;
		    margin-bottom: 20px;
		   
		}
		.box1 label{
		margin-bottom: 8px;
		color:#666;
		display: block;
		}
		.box1 input{
		width: 100%;
		}
		.name{
			border-radius:5px;
			width: 200px;
		}
		.btn{
			background-color: #F19B50;
			width: 200px;
			cursor: pointer;
		}
		.btn:hover{
			background-color:#C8FD8A;
	}
	</style>
</head>

<body>
	<div class="box">
		<h1 align="center">书香校园二手网</h1>
		<label>请输入您的姓名：</label>
		<div class="box1">
			<input id="username" class="name" type="text"  placeholder="例如：肖战">
			<button class="btn" onClick="goIndex()" >立即进入</button>
		</div>
	</div>
   <script>
	function goIndex(){
		var name=document.getElementById("username").value;
		if(name&&name.trim()!==""){
		   alert("验证通过！欢迎"+name);
			
			window.location.href="Untitled-2.html"
		   }
		else{
			alert("姓名不能为空！！！");
		}
	}
	</script>														   
</body>
</html>
