<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>耳机</title>
	<style>
		.body{
			background-color: #F5F5F5;
			font-family: Cambria, "Hoefler Text", "Liberation Serif", Times, "Times New Roman", "serif";
		}
		.card{
			margin: 20% auto;
			width: 280px;
			box-sizing: border-box;
			border-radius: 10px;
			padding: 15px;
			background: white;
			box-shadow: 3px 3px 15px rgba(0,0,0,0.1);
			border: 1px solid #eee;
			
		}
		.image{
			position: relative;
			margin-bottom: 15px;
		}
		.image img{
			width: 100%;
			height: auto;
			border-radius: 4px;
			font-size: 14px;
			font-weight: bold;
		}
		.information{
			display: inline-block;
		}
		.discount{
			position: absolute;
			top:10px;
			right: 10px;
			background: #e74c3c;
			color: white;
			padding: 2px 8px ;
			border-radius: 4px;
			font-size: 14px;
			font-weight: bold;
		}
		.name{
				font-size: 18px;
			    margin-bottom: 8px;
			    color: #333;
		}
		.discription{
			color: #666;
			font-size: 14px;
			line-height: 1.4;
			margin: 0 0 10px 0;
		}
		.rating{
			color: #ffc107;
			font-size: 16px;
			margin-bottom: 15px;
		}
		.price-section{
			text-align: center;
			display: inline-block;
		}
		.current-price{
			font-weight: bold;
			color: #E74C3C;
			font-size: 14px;
		}
		.orignal-price{
			text-decoration: line-through;
			color: #999;
			font-size: 14px;
		}
		.btn{
			background: #3498db;
			color: white;
			border: none;
			border-radius: 4px;
			padding: 8px 16px ;
		    cursor: pointer;
			font-size: 14px;
			margin-left: 80px;
		}
	</style>
</head>

<body>
	<div class="card">
		<div class="image">
			<img src="file:///C:/Users/Administrator/Desktop/27/airpods.webp" alt="图片">
			<span class="discount">-20%</span>
		</div>
		<div class="information">
			<h3 class="name">无线蓝牙耳机</h3>
			<p class="discription">高音质，降噪功能，续航时间长</p>
			<div class="rating">★★★★☆</div>
			
		</div>
		<div class="price-section">
		    <span class="current-price">299</span>
			<span class="orignal-price">375</span>
	    </div>
	</div>
</body>
</html>
